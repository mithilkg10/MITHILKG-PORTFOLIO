<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">MKG CyberLab host-only architecture</title><desc id="desc">Kali is an available operator, unused in Phase 3. Windows creates telemetry, Wazuh collects and detects, and VYOMRIX supports analyst decisions. All guests use host-only networking. No bridge; temporary maintenance NAT is disabled in attack mode.</desc>
